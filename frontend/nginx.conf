server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Re-resolve the api container through Docker's DNS, so restarting only the API
  # (new container IP) does not leave the dashboard with 502s.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8080;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 10s;
  }

  # Hashed build assets never change; the HTML shell always revalidates.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
