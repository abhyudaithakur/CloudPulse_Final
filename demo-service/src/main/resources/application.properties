server.port=${SERVER_PORT:8081}
spring.application.name=demo-service
# One image, two roles: checkout-api calls payment-api (DOWNSTREAM_URL); payment-api is a leaf.
cloudpulse.demo.service-name=${SERVICE_NAME:checkout-api}
cloudpulse.demo.downstream-url=${DOWNSTREAM_URL:}
cloudpulse.demo.downstream-name=${DOWNSTREAM_NAME:payment-api}
# Java 21 virtual threads: thousands of sleeping "slow" requests cost almost nothing.
spring.threads.virtual.enabled=true
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Let in-flight requests finish when Kubernetes stops a pod during a rolling restart.
server.shutdown=graceful
