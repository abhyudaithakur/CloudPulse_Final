# The monitored workloads. One image, two services: checkout-api calls payment-api.
# The liveness probe only asks "is the JVM alive?", so a stuck process (slow but alive) is NOT
# restarted by Kubernetes on its own: noticing that is CloudPulse's job, and restarting it
# takes an operator's approval.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  namespace: cloudpulse-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: payment-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8082"
        prometheus.io/path: /actuator/prometheus
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: payment-api
          image: cloudpulse/demo-service:local
          imagePullPolicy: Never
          env:
            - { name: SERVER_PORT, value: "8082" }
            - { name: SERVICE_NAME, value: payment-api }
          ports:
            - containerPort: 8082
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  namespace: cloudpulse-demo
spec:
  selector:
    app: payment-api
  ports:
    - port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: cloudpulse-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-api
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app: checkout-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
        prometheus.io/path: /actuator/prometheus
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: checkout-api
          image: cloudpulse/demo-service:local
          imagePullPolicy: Never
          env:
            - { name: SERVER_PORT, value: "8081" }
            - { name: SERVICE_NAME, value: checkout-api }
            - { name: DOWNSTREAM_URL, value: "http://payment-api:8082" }
            - { name: DOWNSTREAM_NAME, value: payment-api }
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8081 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8081 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-api
  namespace: cloudpulse-demo
spec:
  selector:
    app: checkout-api
  ports:
    - port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: cloudpulse-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
        - name: traffic-generator
          image: cloudpulse/traffic-generator:local
          imagePullPolicy: Never
          env:
            - { name: TARGET_URL, value: "http://checkout-api:8081/api/work" }
            - { name: REQUESTS_PER_SECOND, value: "4" }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
